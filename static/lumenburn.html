<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LumenBurn - SVG to LightBurn Converter</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #121212; color: #eee; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        .dropzone { border: 2px dashed #555; padding: 40px; text-align: center; border-radius: 8px; margin-bottom: 20px; cursor: pointer; transition: 0.3s; }
        .dropzone:hover, .dropzone.dragover { border-color: #007bff; background: #222; }
        .btn { background: #007bff; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; }
        .btn:hover { background: #0056b3; }
        .btn:disabled { background: #444; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 LumenBurn Engine</h1>
        <p>Convert SVG files to LightBurn (.lbrn2) format with high-density curve linearization.</p>
        
        <div class="dropzone" id="dropzone">
            <p>Drag & Drop your SVG file here, or click to browse.</p>
            <input type="file" id="fileInput" accept=".svg" style="display: none;">
        </div>

        <button class="btn" id="convertBtn" disabled>Convert to LBRN2</button>
        <div id="status"></div>
    </div>
    <script src="lumenburn.js"></script>
</body>
</html>
