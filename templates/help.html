<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DepthForge | Support AI</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #e5e7eb;
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .vintage-font { font-family: 'Cinzel', serif; }

        /* Match the Header from the Generator Page */
        .app-header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #374151;
            padding-bottom: 12px;
            margin-bottom: 24px;
        }

        /* Main Container */
        .chat-wrapper {
            width: 100%;
            max-width: 600px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* Message List - Let it grow naturally */
        #chatBox {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 300px;
        }

        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .ai-msg { background-color: #374151; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user-msg { background-color: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }

        /* Input Area */
        .input-area {
            background-color: #111827;
            border-top: 1px solid #374151;
            padding: 16px;
            display: flex;
            gap: 10px;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        input[type="text"] {
            flex-grow: 1;
            background-color: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .send-btn {
            background-color: #e5e7eb;
            color: #111827;
            font-weight: 800;
            padding: 0 20px;
            border-radius: 8px;
            border: none;
            text-transform: uppercase;
            font-size: 12px;
            cursor: pointer;
        }

        .back-btn {
            background: #1f2937;
            color: #9ca3af;
            border: 1px solid #4b5563;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <img src="/static/logo.png" alt="Logo" style="width: 32px; height: 32px; object-fit: contain;">
            <h2 class="vintage-font" style="margin: 0; font-size: 1.2rem; color: white;">Support AI</h2>
        </div>
        <a href="/menu" class="back-btn">&larr; Menu</a>
    </header>

    <!-- Main Chat Container -->
    <div class="chat-wrapper">
        
        <div id="chatBox">
            <div class="msg ai-msg">
                Hello! I'm the SLCreations assistant. How can I help you today?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask a question..." autocomplete="off" onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="send-btn">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const message = inputField.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chatBox');

            // Add User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'msg user-msg';
            userDiv.textContent = message;
            chatBox.appendChild(userDiv);

            inputField.value = '';
            window.scrollTo(0, document.body.scrollHeight);

            // Add Loading
            const loadingId = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.id = loadingId;
            loadingDiv.className = 'msg ai-msg';
            loadingDiv.style.opacity = '0.5';
            loadingDiv.textContent = 'Thinking...';
            chatBox.appendChild(loadingDiv);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                const loader = document.getElementById(loadingId);
                if(loader) loader.remove();

                if (response.ok) {
                    const aiDiv = document.createElement('div');
                    aiDiv.className = 'msg ai-msg';
                    aiDiv.style.whiteSpace = 'pre-wrap';
                    aiDiv.textContent = data.reply;
                    chatBox.appendChild(aiDiv);
                }
            } catch (error) {
                const loader = document.getElementById(loadingId);
                if(loader) loader.remove();
                console.error(error);
            }
            window.scrollTo(0, document.body.scrollHeight);
        }
    </script>
</body>
</html>
