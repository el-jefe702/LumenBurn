<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DepthForge | Support AI</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #121212; }
        .vintage-font { font-family: 'Cinzel', serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 4px; }
    </style>
</head>
<body class="h-screen text-gray-200 flex flex-col items-center py-8 px-4">

    <!-- Header -->
    <header class="w-full max-w-3xl flex justify-between items-center border-b border-gray-700 pb-4 mb-6 shrink-0">
        <div class="flex items-center gap-4">
            <img src="/static/logo.png" alt="Logo" class="w-12 h-12 object-contain drop-shadow-md">
            <h2 class="text-3xl vintage-font font-bold text-white tracking-wider">Support AI</h2>
        </div>
        <button onclick="window.location.href='/menu'" class="text-sm text-gray-400 hover:text-white transition-colors border border-gray-600 px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700">
            &larr; Back to Menu
        </button>
    </header>

    <!-- Chat Box -->
    <div class="w-full max-w-3xl flex-grow bg-gray-800 border border-gray-700 rounded-xl flex flex-col overflow-hidden shadow-2xl">
        
        <!-- Messages Area -->
        <div id="chatBox" class="flex-grow p-6 overflow-y-auto space-y-4">
            <!-- AI Welcome Message -->
            <div class="flex justify-start">
                <div class="bg-gray-700 text-gray-200 p-4 rounded-2xl rounded-tl-none max-w-[80%] shadow">
                    <p class="text-sm">Hello! I'm the SLCreations AI assistant. How can I help you with your CNC laser projects or the DepthForge app today?</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-gray-900 border-t border-gray-700 flex gap-4 items-center">
            <input type="text" id="userInput" placeholder="Ask a question..." class="flex-grow bg-gray-800 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:border-gray-400" onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-gray-200 text-gray-900 font-bold px-6 py-3 rounded-lg hover:bg-white transition-colors uppercase tracking-wider text-sm">
                Send
            </button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const message = inputField.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chatBox');

            // Add User Message to UI
            chatBox.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-blue-600 text-white p-4 rounded-2xl rounded-tr-none max-w-[80%] shadow">
                        <p class="text-sm">${message}</p>
                    </div>
                </div>
            `;
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Add Loading Indicator
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div id="${loadingId}" class="flex justify-start">
                    <div class="bg-gray-700 text-gray-400 p-4 rounded-2xl rounded-tl-none text-sm animate-pulse">
                        Thinking...
                    </div>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Send to our backend
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (response.ok) {
                    // Add AI Response to UI
                    chatBox.innerHTML += `
                        <div class="flex justify-start">
                            <div class="bg-gray-700 text-gray-200 p-4 rounded-2xl rounded-tl-none max-w-[80%] shadow">
                                <p class="text-sm whitespace-pre-wrap">${data.reply}</p>
                            </div>
                        </div>
                    `;
                } else {
                    throw new Error(data.error || "Server failed to respond.");
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-red-900 text-white p-4 rounded-2xl rounded-tl-none max-w-[80%] shadow">
                            <p class="text-sm">System Error: ${error.message}</p>
                        </div>
                    </div>
                `;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
